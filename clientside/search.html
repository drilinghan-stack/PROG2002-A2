<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charity Events - Search</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Charity Events</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="search.html">Search Events</a>
    </nav>
  </header>

  <main>
    <section class="search-section">
      <h2>Search Events</h2>

      <form id="search-form">
        <div class="form-group">
          <label for="date">Date:</label>
          <input type="date" id="date" name="date">
        </div>

        <div class="form-group">
          <label for="location">Location:</label>
          <input type="text" id="location" name="location" placeholder="e.g. Sydney">
        </div>

        <div class="form-group">
          <label for="category">Category:</label>
          <select id="category" name="category">
            <option value="">All Categories</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn">Search</button>
          <button type="button" id="clear-btn" class="btn btn-secondary">Clear Filters</button>
        </div>
      </form>
    </section>

    <section class="events">
      <h2>Results</h2>
      <div id="results"></div>
      <p id="error-msg" class="error"></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Charity Events. All rights reserved.</p>
  </footer>

  <script src="js/search.js"></script>
</body>
</html>
